name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22, 24, 26]

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Pin npm
        # zizmor: ignore[adhoc-packages] -- Node majors bundle different npm versions; this exact CLI version matches packageManager and the reviewed lockfile contract.
        run: npm install --global npm@11.19.1

      - name: Install from lockfile without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run acceptance gate
        run: npm run check

  coverage:
    name: Coverage thresholds / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Pin npm
        # zizmor: ignore[adhoc-packages] -- Node majors bundle different npm versions; this exact CLI version matches packageManager and the reviewed lockfile contract.
        run: npm install --global npm@11.19.1

      - name: Install from lockfile without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Enforce built-in coverage thresholds
        run: npm run test:coverage
